# Приложения автозапуска (XDG autostart → app-*@autostart.service) — после Glide Shell, а она считается
# запущенной, когда загрузилась (ExecStartPost tools/glide-ready.sh). Без этого при входе Steam, Vesktop,
# Throne и прочие читали HDD одновременно с оболочкой, и бар появлялся через ~25 с.
# Только порядок (After), не зависимость: нет Glide Shell — приложения запускаются как обычно.
[Unit]
After=glide-shell.service
