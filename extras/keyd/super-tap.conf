# keyd для Glide Shell: короткое нажатие левого Super (отпустили быстрее 250 мс, ничего не нажав вместе с ним)
# посылает F13 — в niri это XF86Tools → центр управления. Удержание и все Super+клавиша работают как обычно.
# Если клавиатура вдруг «сломалась»: Backspace+Escape+Enter одновременно — keyd выключается (его аварийный выход).
[ids]
*

[main]
leftmeta = overloadt(meta, f13, 250)
