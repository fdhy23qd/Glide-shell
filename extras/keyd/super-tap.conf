# keyd для Glide Shell: короткое нажатие левого Super — F13 (в niri это XF86Tools → центр управления).
# overload: если вместе с Super нажата ЛЮБАЯ клавиша — это сочетание (Super+D и т. п.), центр не открывается,
# даже при очень быстром нажатии; overload_tap_timeout: держали дольше 250 мс (например, Super + мышь) — тоже нет.
# (Раньше было overloadt: при быстром Super+клавиша оно считало Super касанием и открывало центр.)
# Если клавиатура вдруг «сломалась»: Backspace+Escape+Enter одновременно — keyd выключается (его аварийный выход).
[ids]
*

[global]
overload_tap_timeout = 250

[main]
leftmeta = overload(meta, f13)
